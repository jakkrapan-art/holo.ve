maxLevel: 3 # tower max level
towerClass: warrior # tower class (Assassin, Hero, Marksman, Robotic, SpellCaster, Warrior)
generation: tempus # tower generation (Myth, Tempus)
attackType: physic # physic | magic (1 tower 1 type ตาม design)
evolutionCost: 1 # ค่า evolution

attack_sound: "hit" # ชื่อเสียงที่ใช้ตอนโจมตี (enum ใน sound_database.gd VOICE_NAME)
evolution_attack_sound: "" # optional evolved SFX key; empty = use attack_sound
open_sound: "open" # ชื่อเสียงที่ใช้ตอนเปิดตัว
evolve_sound: "" # optional evolve voice key (VOICE_NAME); empty = no evolve voice
# attack_vfx: "blue" # optional — ชื่อ VFX ตอนโจมตี (enum ใน attack_vfx.gd AttackVFXName); ไม่ใส่ = "default"

stats:
  - damage: 80 # ค่าพลังโจมตี
    attackRange: 2.0 # ระยะการตี (cell)
    attackSpeed: 80.0 # ความเร็วการโจมตี
    critChance: 15.0
    critMultiplier: 1.5
    mana: 120 # ค่า mana สูงสุด
    initialMana: 60 # ค่า mana เริ่มต้น

  - damage: 120
    attackRange: 2.0
    attackSpeed: 80.0
    critChance: 15.0
    critMultiplier: 1.5
    mana: 120
    initialMana: 60

  - damage: 180
    attackRange: 2.0
    attackSpeed: 80.0
    critChance: 15.0
    critMultiplier: 1.5
    mana: 120
    initialMana: 60

# ── Skill slots (ทรงใหม่) ────────────────────────────────────────────
# skills.active = Active Skill (auto-cast ตอน Energy เต็ม)
# skills.passive = Passive Skill (ยังไม่มี runtime — ใส่ null ไว้ก่อน)
skills:
  active:
    name: "Skill"
    names: ["Skill I", "Skill II", "Skill III"] # optional UI display names per tower level
    desc: "Just a skill with {damageBonus:percent} bonus" # tokenized display text: {param} / {param:percent} (decimal x100) / {param:pct} (percent-scale as-is) resolve from parameters; token-free text renders as-is. Stack-bonus form {param:percent:+effect_id} renders " (+per-stack x live stacks)" on a placed tower and nothing on card surfaces - write NO space before it (see mori_calliope.yaml)
    icon: "" # optional — ว่างได้ ถ้ายังไม่มี icon
    # tags = ป้ายสรุปสกิลแบบผู้เล่นอ่าน (controlled registry)
    tags:
      - damage
      - weapon
      - aoe
      - enemy
    # target_summary = สรุป target ระดับสกิลไว้โชว์ UI (บรรทัด AFFECTS ใน tooltip อ่าน team+shape)
    # เป็น display-only ทั้งชั้น — พฤติกรรมจริงมาจาก actions เท่านั้น
    # กติกาสรุป: ใช้ target ของเอฟเฟกต์เด่นที่ desc ขึ้นต้น = ตัวแรกใน effects (Director 2026-07-18)
    # target_team = ใครโดน ไม่ใช่ร่ายจากไหน — สกิลร่ายรอบตัวที่ตีศัตรู = enemy (เคส IO Spirits)
    # ใช้ block map เท่านั้น อย่าใช้ inline {...} (custom YAML parser support flow จำกัด)
    target_summary:
      target_team: enemy # self | enemy | ally | both
      target_type: enemy # tower | enemy | any (ยังไม่ถูกแสดงผล — field สำรอง)
      target_shape: area # single | area | global
    # effects = พิมพ์เขียวรายเอฟเฟกต์แนว Dota (เรียงเอฟเฟกต์เด่นก่อน) — ยังไม่มีโค้ดอ่าน ไว้รอ tooltip ละเอียดในอนาคต
    effects:
      - name: "Area Damage"
        target:
          target_team: enemy
          target_type: enemy
          target_shape: area
    # recovery = ช่วงจบ (วินาที): หลัง action สุดท้ายจบ tower ค้างท่า/ไม่กลับไปตีต่อทันที
    # ตามโมเดล ตัว(cast_time = เวลาร่าย/เล่นท่า)/หาง(recovery) — ไม่ใส่ = default 0.2
    recovery: 0.2
    # cast_target = เงื่อนไขเริ่มร่าย: ไม่ใส่ = ต้องมีเป้าล็อกในระยะตี (แบบเดิม)
    # ใส่ global = ร่ายได้เมื่อมีศัตรูตัวใดก็ได้บนแผนที่ (สกิลเป้าสุ่มทั้งสนาม เช่น Flayon)
    # cast_target: global
    parameters:
      damageBonus:
        - 0.10
        - 0.15
        - 0.20
    actions:
      - type: find_multi_enemy
        data:
          width: 3
          height: 1
          # center_on_self: true  # optional — กล่องวางกึ่งกลางตัว tower แกนตรง ไม่หมุนตามเป้า
          #                       # (สกิลตีรอบตัว เช่น 3x3 ของ Calliope) ไม่ใส่ = กล่องพุ่งหาเป้าแบบเดิม
      - type: play_animation
        data:
          animation: "skill"
          # cast_time: 0.5   # เวลาร่ายทั้งคลิป (วินาที): ย่อ/ยืดทุกเฟรม "ตามสัดส่วน" ให้จบพอดีเวลานี้
          #                  # (เฟรมที่ artist หน่วงไว้ยังยาวกว่าเฟรมอื่นตามสัดส่วนเดิม) ไม่ใส่ = เล่น speed ปกติ
          # impact_frame: 8  # จุดโดน: action ถัดไป (ดาเมจ/effect) ทำงานตอนคลิปถึงเฟรมนี้ (นับแบบ artist เริ่มที่ 1)
          #                  # เฟรมที่เหลือ = ท่าค้างจบ เล่นต่อจนครบ cast_time — ไม่ใส่ = โดนที่ ~80% ของเวลาคลิป
      - type: attack
        data:
          damage: 100
          damage_type: physic
          # ─────────────────────────────────────────────────────────────────
          # Phase 3 Block C — Skill Multiplier (สำหรับ skill tower เท่านั้น)
          #
          # damage_multiplier:
          #   - scalar  → ใช้ค่าเดียว ทุก level     เช่น 2.0 (200% Total Attack)
          #   - array   → ค่าแต่ละ level [L1, L2, L3]  เช่น [1.4, 1.5, 1.7]
          #
          # damage_type ถ้าไม่ใส่ → ใช้ tower.attackType (default ตาม design 1 tower 1 type)
          #
          # crit_rule: (skill ไม่ crit เว้นแต่สั่งเปิด — default = no_crit)
          #   - no_crit (default, ไม่ต้องเขียน) → skill ไม่ crit
          #   - use_crit_chance → skill roll crit ตามเลขของ tower
          #   - guaranteed_crit → crit ทุก hit ไม่สน crit chance (เช่น ปืน Altare beat 2)
          #
          # hit_distribution: [r1, r2, ...]  ← multi-hit, แบ่ง 100% ของ final damage
          #   ⚠️ caution: ผลรวม ratio ต้อง = 1.0 ไม่งั้น push_warning
          #   ⚠️ ใช้ได้กับ skill ของ tower เท่านั้น (basic attack ไม่มี multi-hit)
          #
          # ตัวอย่าง 4-hit skill ความเสียหาย 200% รวม:
          #   - type: attack
          #     data:
          #       damage_multiplier: 2.0
          #       hit_distribution: [0.2, 0.2, 0.1, 0.5]   # รวม = 1.0 ✓
          #
          # ตัวอย่าง skill ที่ crit ได้และ scale ตาม level:
          #   - type: attack
          #     data:
          #       damage_multiplier: [1.4, 1.5, 1.7]
          #       crit_rule: use_crit_chance
          #
          # stack_bonus_effect + stack_bonus_per_stack_param_name:
          #   สกิลสเกลตาม stack (เช่น Soul ของ Calliope) — ตัวคูณเพิ่มขึ้น
          #   จำนวน stack ของ effect id นั้นบน tower x ค่าต่อ stack (อ่านสดตอนตี)
          #   ตัวอย่าง: stack_bonus_effect: "soul"
          #             stack_bonus_per_stack_param_name: "soulBonus"
          # ─────────────────────────────────────────────────────────────────
      - type: play_animation
        data:
          animation: "idle"
      # ─────────────────────────────────────────────────────────────────
      # COMBO SKILL (หลายท่าใน cast เดียว) — pattern แบบ "beat"
      #
      # 1 beat = play_animation(1 คลิป non-loop) + cast_time(วินาที) + effect ต่อท้าย
      #   • cast_time ยืด/ย่อทั้งคลิปตามสัดส่วนเฟรม (เฟรมหน่วงของ artist นับน้ำหนักด้วย)
      #   • impact_frame = เฟรมจุดโดน (นับเริ่ม 1): ดาเมจ/effect ลงตรงเฟรมนั้น แล้วเฟรมท้าย
      #     เล่นต่อจนครบ cast_time — ไม่ใส่ = ลงที่ ~80% ของเวลาคลิป
      #   • ชื่อคลิป: skill_1, skill_2, ... skill_N (ต้องมีใน SpriteFrames ของ .tscn)
      #     คลิปสกิลทุกตัวต้อง loop=false — เปิด loop ไว้ = ท่าจบไม่ค้าง + เกมขึ้นเตือน
      #   • ท่าเชื่อม (เช่น ควงปืน) วาดไว้ "หัวคลิป" ของ beat ถัดไป — ไม่มีคลิป "pre" แยก
      #   • beat สุดท้ายปิดด้วย play_animation "idle" เสมอ (คืน speed ปกติ)
      #   • ห้ามต่อ delay หลัง play_animation ของ beat — คุมจังหวะที่ cast_time พอ
      #   • ท่าชาร์จ/ง้างก่อนฟัน วาดใส่หัวคลิป beat 1 (คีย์ cast_time ระดับสกิลถูกลบแล้ว)
      #   • ใช้ได้ทั้ง skills.active และ evolution_skills.active เหมือนกัน
      #
      # ตัวอย่าง 2 beat (ฟันดาบ → ควงปืนยิง) — ของจริงดู regis_altare.yaml:
      #   actions:
      #     - type: find_multi_enemy
      #       data:
      #         width: 3
      #         height: 1
      #     - type: play_animation        # beat 1: ดาเมจฟันลง ~0.4s
      #       data:
      #         animation: "skill_1"
      #         cast_time: 0.5
      #     - type: attack
      #       data:
      #         damage: 100
      #         damage_type: physic
      #     - type: clear_enemy
      #     - type: find_multi_enemy
      #       data:
      #         width: 1
      #         height: 3
      #     - type: play_animation        # beat 2: ท่าควงปืนอยู่หัวคลิปนี้, ยิงลง ~0.8s
      #       data:
      #         animation: "skill_2"
      #         cast_time: 1.0
      #     - type: attack
      #       data:
      #         damage: 150
      #         damage_type: magic
      #     - type: play_animation
      #       data:
      #         animation: "idle"
      # ─────────────────────────────────────────────────────────────────
      # AFTERSHOCK (ระเบิดตามหลัง ไม่บล็อกการตี) — ของจริงดู mori_calliope.yaml
      #
      #   วางไว้หลัง attack แรก: action นี้วางระเบิดแล้วจบ cast ทันที tower
      #   กลับไปตีต่อได้ระหว่างรอ ครบ delay แล้วพื้นที่เดิม (กึ่งกลางตำแหน่ง
      #   ตอน cast) ระเบิดซ้ำด้วยการหาเป้าใหม่สด — คีย์ damage/crit/stack_bonus
      #   ชุดเดียวกับ attack ใช้ในระเบิดได้หมด
      #
      #   - type: aftershock
      #     data:
      #       delay_param_name: "aftershockDelay"   # หรือใส่ delay: 0.5 ตรง ๆ
      #       width: 3
      #       height: 3
      #       damage_multiplier_param_name: "aftershockDamage"
      #       damage_type: physic
      #       stack_bonus_effect: "soul"
      #       stack_bonus_per_stack_param_name: "aftershockSoulBonus"
      # ─────────────────────────────────────────────────────────────────
      # CHANNEL (ร่ายค้าง ฟาดโซนเดิมซ้ำเป็นจังหวะ) — ของจริงดู ninomae_ina_nis.yaml
      #
      #   วางต่อจาก find_multi_enemy แรก: โซนล็อกที่จุดเล็งตอนเริ่มร่าย tower
      #   ค้าง (ไม่ตีปกติ) จน channel จบ แต่ละ tick หาเป้าใหม่สดในโซนเดิม
      #   ตีทั้งโซน — คีย์ damage/crit/effects ชุดเดียวกับ attack ใช้ได้หมด
      #   ยกเลิกกลางคัน (จบเวฟ) = หยุดฟาดทันที ไม่กิน Energy
      #
      #   - type: channel
      #     data:
      #       width: 3
      #       height: 3
      #       cast_time_param_name: "channelDuration"     # หรือ cast_time: 3.0 ตรง ๆ
      #       tick_interval_param_name: "tickInterval"    # หรือ tick_interval: 0.25 ตรง ๆ
      #       animation: "skill"                          # คลิปร่าย เล่นค้างตลอด channel
      #       damage_multiplier_param_name: "tickDamage"
      #       damage_type: magic
      #       crit_rule: no_crit
      #       effects:
      #         - effect: "stun"
      #           duration_param: "tickStun"
      #       # strike: (optional) เปลี่ยนทุก tick เป็น global_strike สุ่มเป้าใหม่ทั้งสนาม
      #       # แทนการฟาดโซนเดิม (คีย์ชุดเดียวกับ GLOBAL STRIKE ข้างล่าง) —
      #       # ของจริงดู machina_x_flayon.yaml ร่าง evolve
      #       # strike:
      #       #   width: 3
      #       #   height: 3
      #       #   speed: 4.0
      #       #   spawn_distance: 6.0
      #       #   damage_multiplier_param_name: "tickDamage"
      #       #   damage_type: magic
      # ─────────────────────────────────────────────────────────────────
      # ─────────────────────────────────────────────────────────────────
      # FIELD (โซนค้างรอบตัว ไม่บล็อกการตี) — ของจริงดู banzoin_hakka.yaml
      #
      #   วางต่อจาก find_multi_enemy แรก: โซนวางกลางตัว tower แล้วจบ cast
      #   ทันที (ไม่บล็อก เหมือน aftershock) tower กลับไปตีปกติต่อได้ระหว่าง
      #   โซนทำงานเอง นาน duration วินาที แต่ละ tick หาเป้าใหม่สดในกล่องรอบตัว
      #   ตี + ลง effect (เช่น slow) — คีย์ damage/crit/effects ชุดเดียวกับ
      #   attack ใช้ได้หมด; energy_refund_percent = คืน Energy % ตอนโซนหมดเวลา
      #   (จบธรรมชาติเท่านั้น); ยกเลิกกลางคัน (จบเวฟ) = หยุดทันที ไม่คืน
      #
      #   - type: field
      #     data:
      #       width: 3
      #       height: 3
      #       duration_param_name: "skillDuration"      # หรือ duration: 10.0 ตรง ๆ
      #       tick_interval_param_name: "tickInterval"  # หรือ tick_interval: 1.0 ตรง ๆ
      #       damage_multiplier_param_name: "skillDamage"
      #       damage_type: magic
      #       crit_rule: no_crit
      #       energy_refund_percent_param_name: "energyRefund"   # optional (ใช้ตอน evolve)
      #       effects:
      #         - effect: "move_speed_down"
      #           value_param: "slowEffect"
      #           duration: 1.5
      # ─────────────────────────────────────────────────────────────────
      # GLOBAL STRIKE (ยิงเป้าสุ่มทั้งแผนที่) — ของจริงดู machina_x_flayon.yaml
      #
      #   ไม่ต้องมี find_multi_enemy นำ: action นี้สุ่มศัตรู 1 ตัวจากทั้งสนามเอง
      #   (คู่กับ cast_target: global ระดับสกิล) แล้วยิง carrier จากจุดเฉียง
      #   ห่างเป้าระยะคงที่ → เวลาถึงตัวเท่ากันทุกนัด ระเบิดเป็นกล่องที่จุดตก
      #   ไม่มีศัตรูทั้งสนามตอนเริ่ม = ยกเลิก ไม่กิน Energy — คีย์ damage/crit
      #   ชุดเดียวกับ attack ใช้ได้หมด
      #
      #   - type: global_strike
      #     data:
      #       width: 1
      #       height: 1
      #       speed: 4.0                # ความเร็ว carrier (ช่อง/วิ)
      #       spawn_distance: 6.0       # ระยะจุดยิงห่างเป้า (ช่อง) — คงที่ = เวลาตกคงที่
      #       spawn_angle_deg: 45.0     # มุมเฉียงจากแนวดิ่ง (สุ่มฝั่งซ้าย/ขวาเองต่อนัด)
      #       angle_jitter_deg: 10.0    # สุ่มแกว่งมุมต่อนัด (imperfection)
      #       animation: "skill"        # คลิปร่าย — cast_time/impact_frame ใช้ได้เหมือน play_animation
      #       cast_time: 0.5
      #       damage_multiplier_param_name: "skillDamage"
      #       damage_type: magic
      #       crit_rule: no_crit
      # ─────────────────────────────────────────────────────────────────
      # SEQUENCE (ร่ายสำเร็จ = เลื่อนท่าถัดไป ครบแล้ววนกลับท่าแรก) — ของจริงดู axel_syrios.yaml
      #
      #   ใช้คีย์ sequence: แทน actions: (ห้ามมีคู่กัน — มีคู่ = เตือนแล้วใช้ sequence)
      #   แต่ละ phase = 1 ท่า มีชุด actions เต็มของตัวเอง (find → play_animation
      #   → play_sound → attack → idle) + icon/สี/เสียงของตัวเอง
      #   • ร่ายสำเร็จ 1 ครั้ง = ออกท่าปัจจุบัน แล้วเลื่อนไปท่าถัดไป ครบแล้ววนท่า 1
      #   • fizzle (ไม่มีเป้าตอนเริ่มร่าย) = ไม่เลื่อนท่า ไม่กิน Energy
      #     whiff (ร่ายออกแต่กล่องว่าง) = เลื่อนท่าตามปกติ
      #   • เริ่ม wave ใหม่ = กลับท่า 1 เสมอ; หลัง evolve ก็เริ่มท่า 1
      #   • parameters ชุดเดียวใช้ร่วมทุก phase (ผูกผ่าน *_param_name เหมือนเดิม)
      #   • icon_tint = สีย้อม icon placeholder ต่อท่า — ค่า "#RRGGBB" ต้องอยู่ใน
      #     เครื่องหมายคำพูดเสมอ (# เปล่า ๆ = comment ค่าจะหายเงียบ)
      #   • คลิปต่อท่าตั้งชื่อ skill_1..skill_N ใน SpriteFrames ของ .tscn (loop=false)
      #   • stats panel โชว์ icon/สีของ "ท่าถัดไป" เอง — ไม่ต้องตั้งอะไรเพิ่ม
      #
      #   sequence:
      #     - label: "Spear Thrust"        # ชื่อท่า (กันไว้สำหรับ tooltip อนาคต)
      #       icon: ""                     # icon เฉพาะท่า (ว่าง = ใช้ fallback)
      #       icon_tint: "#4FC3F7"
      #       actions:
      #         - type: find_multi_enemy
      #           data:
      #             width: 1
      #             height: 2
      #         - type: play_animation
      #           data:
      #             animation: "skill_1"
      #             cast_time: 0.5
      #         - type: play_sound         # เสียงต่อท่า (optional) — id จากตาราง SFX_NAME
      #           data:
      #             sfx: "skill_syrios_spear"
      #         - type: attack
      #           data:
      #             damage_multiplier_param_name: "spearDamage"
      #             damage_type: physic
      #         - type: play_animation
      #           data:
      #             animation: "idle"
      #     - label: "Sword Slash"
      #       icon_tint: "#81C784"
      #       actions:
      #         # ...ชุด actions เต็มของท่าถัดไป รูปแบบเดียวกัน
  passive: null

# evolutionName = ชื่อโชว์หลัง evolve (tower เปลี่ยนร่าง เช่น Flayon → "R-TRUS")
# ไม่ใส่ = ใช้ชื่อเดิม; ชุด sprite ร่างใหม่ตั้งที่ scene (.tscn) ช่อง evolution_sprite_frames
# evolutionName: "R-TRUS"

# evolutionStat = stat ตอน evolve (block เดียว ไม่ใช่ array)
evolutionStat:
  damage: 240
  attackRange: 2.0
  attackSpeed: 100.0
  critChance: 50.0
  critMultiplier: 1.5
  mana: 120
  initialMana: 80

# evolution_skills = สกิลร่างวิวัฒน์ (ทรงเดียวกับ skills) — optional
evolution_skills:
  active:
    name: "Evolved Skill"
    desc: "Just a stronger skill with {damageBonus:percent} bonus"
    icon: ""
    tags:
      - damage
      - weapon
      - aoe
      - enemy
    target_summary:
      target_team: enemy
      target_type: enemy
      target_shape: area
    effects:
      - name: "Area Damage"
        target:
          target_team: enemy
          target_type: enemy
          target_shape: area
    recovery: 0.2 # ช่วงจบ (วินาที) — ดูคอมเมนต์ที่ skills.active
    parameters:
      # Single-tier (evolve) values are scalars: the desc renderer colors
      # per-level arrays as "scaling", scalars as "fixed" (two-tone rule).
      damageBonus: 0.30
    actions:
      - type: find_multi_enemy
        data:
          width: 3
          height: 3
      - type: play_animation
        data:
          animation: "skill"
      - type: attack
        data:
          damage_multiplier: 2.0
          damage_type: physic
      - type: play_animation
        data:
          animation: "idle"
  passive: null
